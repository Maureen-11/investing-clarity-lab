<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>简投学堂 · Jiantou Academy</title>
  <meta name="description" content="A beginner-friendly investing education and contribution planning tool.">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffdf9;color:#0a2540;font:16px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.box{width:min(88vw,560px);padding:44px;border:1px solid #ded3c1;border-radius:26px;background:#f7f1e6}.mark{display:flex;align-items:flex-end;gap:4px;height:34px}.mark i{display:block;width:6px;border-radius:4px;background:#16765f}.mark i:nth-child(1){height:15px}.mark i:nth-child(2){height:24px}.mark i:nth-child(3){height:34px}h1{font:500 42px/1.2 Georgia,"Songti SC",serif;margin:24px 0 12px}p{color:#5d6d7b;line-height:1.8}.links{display:grid;gap:10px;margin-top:28px}.links a{padding:14px 18px;border-radius:12px;background:#0b2b4f;color:white;text-decoration:none;font-weight:700}.links a:hover{background:#16765f}
  </style>
  <script>
    (()=>{try{const saved=localStorage.getItem('jiantou-language');const langs=navigator.languages||[navigator.language||''];const target=saved||(langs.some(v=>/zh-(TW|HK|MO)|zh-Hant/i.test(v))?'zh-hant':langs.some(v=>/^zh/i.test(v))?'zh-hans':'en');location.replace(`./${target}/`)}catch{}})();
  </script>
</head>
<body>
  <main class="box">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>简投学堂<br>Jiantou Academy</h1>
    <p>Choose your language · 選擇語言 · 选择语言</p>
    <div class="links"><a href="./zh-hans/">简体中文</a><a href="./zh-hant/">繁體中文</a><a href="./en/">English</a></div>
  </main>
</body>
</html>
