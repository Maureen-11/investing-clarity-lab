name: Weekly ETF data update

on:
  schedule:
    # Monday 10:00 Asia/Shanghai, after the previous week's markets have closed.
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-etf-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Download and validate all 100 ETF histories
        run: npm run data:update:market
        env:
          ETF_FETCH_PAUSE_MS: "500"
      - run: npm run lint
      - run: npm test
      - run: npm run build:pages
      - name: Commit the complete snapshot only
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/data/etf-history public/data/etf-pack-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/etf-history public/data/etf-pack-manifest.json
          git commit -m "data: refresh 100 ETF histories"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the validated Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
